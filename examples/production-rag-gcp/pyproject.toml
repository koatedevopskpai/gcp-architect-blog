[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-gcp"
version = "0.1.0"
description = "Production RAG on GCP under budget: FastAPI on Cloud Run + pgvector on Cloud SQL, deterministic-first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi", "uvicorn", "pydantic>=2", "psycopg[binary]>=3.1", "google-genai>=1.0"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pytest-cov>=4"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-fail-under=80 --cov-report=term:skip-covered"
