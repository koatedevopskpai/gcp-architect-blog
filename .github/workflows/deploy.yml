name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless: mint OIDC token for Workload Identity Federation

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/495127995935/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: gh-actions-deploy@gcp-architect-blog.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project gcp-architect-blog