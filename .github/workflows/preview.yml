name: Preview Deploy (PR)

on:
  pull_request:

permissions:
  contents: read
  id-token: write # keyless: mint OIDC token for Workload Identity Federation

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check posts
        run: npm run check:posts

      # The build runs scripts/render-mermaid-html.mjs, which launches headless
      # Chromium via Playwright. `npm ci` installs the package but not the browser
      # binary, so it must be installed explicitly or the build fails at launch.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/495127995935/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: gh-actions-deploy@gcp-architect-blog.iam.gserviceaccount.com

      - name: Deploy preview channel
        run: npx --yes firebase-tools@latest hosting:channel:deploy pr-${{ github.event.number }} --project gcp-architect-blog --expires 7d